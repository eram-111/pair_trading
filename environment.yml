name: pair-trading
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.2.2+cpu ; sys_platform == "linux"
      - torch==2.2.2 ; sys_platform == "darwin"
      - torch==2.2.2+cpu ; sys_platform == "win32"
      - numpy==1.26.4
      - pandas==3.0.5
      - pyarrow==25.0.0
      - scipy==1.16.0
      - yfinance==1.5.2
      - curl_cffi==0.16.0
      - scikit-learn==1.9.0
      - statsmodels==0.14.6
      - matplotlib==3.10.3
      - pytest==9.1.1
